<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HireNow · Find jobs near you</title>
<meta name="description" content="HireNow helps people in Cambodia find jobs nearby and helps employers hire fast.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #0891B2; --grad-start: #0B7F99; --bg: #F3F6F5; --text: #12303C; --muted: #6A7C84; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0D1E28; --text: #E8F1F4; --muted: #9AB0B8; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font: 400 15px/1.55 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .hero { background: linear-gradient(160deg, var(--grad-start), var(--primary)); color: #fff; padding: 56px 16px 64px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .brand svg { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .brand span { font: 800 22px/1 "Plus Jakarta Sans", Inter, sans-serif; }
  h1 { font: 800 clamp(30px, 7vw, 40px)/1.15 "Plus Jakarta Sans", Inter, sans-serif; letter-spacing: -.5px; margin: 0 0 12px; }
  .hero p { margin: 0; font-size: 17px; opacity: .9; max-width: 32ch; }
  main { padding: 32px 16px 48px; }
  main p { color: var(--muted); margin: 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 32px; }
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" fill="#0891B2"/><path d="M328 360V696M328 520H696V696" fill="none" stroke="#fff" stroke-width="144" stroke-linecap="round" stroke-linejoin="round"/><circle cx="696" cy="272" r="88" fill="#FFAF22"/></svg>
        <span>HireNow</span>
      </div>
      <h1>Find your next job, close to home.</h1>
      <p>Browse part-time, full-time and weekend jobs nearby, or post a job and hire fast.</p>
    </div>
  </header>
  <main><div class="wrap"><p>Get HireNow on your phone to start.</p></div></main>
  <footer>© HireNow · hirenowjobs.com</footer>
</body>
</html>
